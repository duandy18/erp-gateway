map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream erp_web {
    server host.docker.internal:5170;
}

upstream erp_api {
    server host.docker.internal:7990;
}

upstream wms_api {
    server host.docker.internal:8000;
}

upstream pms_api {
    server host.docker.internal:8005;
}

upstream oms_api {
    server host.docker.internal:8010;
}

upstream procurement_api {
    server host.docker.internal:8015;
}

upstream logistics_api {
    server host.docker.internal:8020;
}

server {
    listen 7080;
    server_name localhost 127.0.0.1;

    client_max_body_size 20m;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "erp-gateway ok\n";
    }

    # =========================
    # API routes
    # =========================

    location = /api/erp {
        return 308 /api/erp/;
    }

    location ^~ /api/erp/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api/erp;

        proxy_pass http://erp_api/;
    }

    location = /api/wms {
        return 308 /api/wms/;
    }

    location ^~ /api/wms/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api/wms;

        proxy_pass http://wms_api/;
    }

    location = /api/pms {
        return 308 /api/pms/;
    }

    location ^~ /api/pms/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api/pms;

        proxy_pass http://pms_api/;
    }

    location = /api/oms {
        return 308 /api/oms/;
    }

    location ^~ /api/oms/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api/oms;

        proxy_pass http://oms_api/;
    }

    location = /api/procurement {
        return 308 /api/procurement/;
    }

    location ^~ /api/procurement/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api/procurement;

        proxy_pass http://procurement_api/;
    }

    location = /api/logistics {
        return 308 /api/logistics/;
    }

    location ^~ /api/logistics/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api/logistics;

        proxy_pass http://logistics_api/;
    }

    location ^~ /api/ {
        add_header Content-Type text/plain;
        return 404 "api route is not registered in erp-gateway\n";
    }

    # =========================
    # Static app web routes
    #
    # These locations serve built frontend artifacts from:
    #   /srv/apps/wms
    #   /srv/apps/pms
    #   /srv/apps/oms
    #   /srv/apps/procurement
    #   /srv/apps/logistics
    #
    # Each app must be built with its own base path:
    #   /wms/
    #   /pms/
    #   /oms/
    #   /procurement/
    #   /logistics/
    # =========================

    location = /wms {
        return 308 /wms/;
    }

    location ^~ /wms/ {
        root /srv/apps;
        index index.html;
        try_files $uri $uri/ /wms/index.html;
    }

    location = /pms {
        return 308 /pms/;
    }

    location ^~ /pms/ {
        root /srv/apps;
        index index.html;
        try_files $uri $uri/ /pms/index.html;
    }

    location = /oms {
        return 308 /oms/;
    }

    location ^~ /oms/ {
        root /srv/apps;
        index index.html;
        try_files $uri $uri/ /oms/index.html;
    }

    location = /procurement {
        return 308 /procurement/;
    }

    location ^~ /procurement/ {
        root /srv/apps;
        index index.html;
        try_files $uri $uri/ /procurement/index.html;
    }

    location = /logistics {
        return 308 /logistics/;
    }

    location ^~ /logistics/ {
        root /srv/apps;
        index index.html;
        try_files $uri $uri/ /logistics/index.html;
    }

    # =========================
    # ERP Web remains dev-proxied
    # =========================

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_pass http://erp_web;
    }
}
