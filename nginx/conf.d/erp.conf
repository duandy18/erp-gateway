map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream erp_web {
    server host.docker.internal:5170;
}

upstream erp_api {
    server host.docker.internal:7990;
}

server {
    listen 7080;
    server_name localhost 127.0.0.1;

    client_max_body_size 20m;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "erp-gateway ok\n";
    }

    location = /api/erp {
        return 308 /api/erp/;
    }

    location ^~ /api/erp/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api/erp;

        proxy_pass http://erp_api/;
    }

    location ^~ /api/ {
        add_header Content-Type text/plain;
        return 404 "api route is not registered in erp-gateway\n";
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_pass http://erp_web;
    }
}
