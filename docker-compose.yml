services:
  erp-gateway:
    image: nginx:1.27-alpine
    container_name: erp-gateway
    ports:
      - "7080:7080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: unless-stopped
